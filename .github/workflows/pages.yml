name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore and verify original website
        shell: bash
        run: |
          set -euo pipefail
          cat site.tar.gz.part-* > "$RUNNER_TEMP/site.tar.gz"
          echo "451b01bf2e593f4313f45d21688d017d6db7965cf5edcdad603f4ef26e330d3a  $RUNNER_TEMP/site.tar.gz" | sha256sum --check
          mkdir -p public
          tar -xzf "$RUNNER_TEMP/site.tar.gz" -C public
          test -f public/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
